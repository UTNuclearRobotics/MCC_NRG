[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcc"
version = "0.1.0"
description = "Minimal MCC model package (library + CLI) – ROS-safe"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name="Your Name", email="you@example.com"}]

dependencies = [
  "numpy",
  "torch"                 # or pin a CUDA wheel you know works
]

[tool.setuptools.packages.find]
where = ["src"]