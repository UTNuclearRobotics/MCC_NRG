[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "MCC-NRG"                 # distribution name
version = "0.1.0"
description = "Models and deployment tools for MCC_NRG"
readme = "README.md"
requires-python = ">=3.8"
authors = [{name = "Alex Diaz", email = "contact@adiaz.me"}]
license = {text = "MIT"}
dependencies = [
  # "torch>=2.1",
  # "numpy>=1.24",
  # "opencv-python",
  # add your real deps here
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["MCC_NRG*"]

# Optional CLIs (uncomment if you want commands installed)
# [project.scripts]
# mcc-nrg = "MCC_NRG.main_mcc:main"
# mcc-deploy = "MCC_NRG.deploy:main"
